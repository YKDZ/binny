name: binny

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: binny
      POSTGRES_USER: binny
      POSTGRES_PASSWORD: ${BINNY_POSTGRES_PASSWORD:?请设置数据库密码}
    volumes:
      - type: bind
        source: ${BINNY_APPDATA_DIRECTORY:?请设置应用数据目录}/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U binny -d binny"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  server:
    image: ${BINNY_IMAGE:-binny/server:local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://binny:${BINNY_POSTGRES_PASSWORD:?请设置数据库密码}@postgres:5432/binny
      BINNY_API_URL: http://127.0.0.1:3000
      BINNY_BROWSER_CAPACITY_LIMIT: ${BINNY_BROWSER_CAPACITY_LIMIT:-1}
      BINNY_HUMAN_SESSION_VIEWER_WAIT_MS: ${BINNY_HUMAN_SESSION_VIEWER_WAIT_MS:-60000}
      BINNY_RESOURCE_DIRECTORY: /var/lib/binny/resources
      PORT: 3000
    ports:
      - "${BINNY_LISTEN_ADDRESS:-0.0.0.0}:${BINNY_PORT:-5030}:3000"
    volumes:
      - type: bind
        source: ${BINNY_ARCHIVE_DIRECTORY:?请设置归档资源目录}
        target: /var/lib/binny/resources
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - node
        - --eval
        - fetch('http://127.0.0.1:3000/health').then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    stop_grace_period: 30s
    restart: unless-stopped

  runtime-rss:
    image: ${BINNY_RSS_IMAGE:-binny/rss:local}
    depends_on:
      server:
        condition: service_healthy
    environment:
      BINNY_API_URL: http://server:3000
      BINNY_BIN_ID: ${BINNY_RSS_BIN_ID:-rss}
      BINNY_RUNTIME_ENVIRONMENT: lightweight
      BINNY_RUNTIME_PORT: 8080
      BINNY_COLLECTOR_STATE_DIRECTORY: /var/lib/binny/collector-state
    volumes:
      - type: bind
        source: ${BINNY_APPDATA_DIRECTORY:?请设置应用数据目录}/runtime/rss
        target: /var/lib/binny/runtime
        bind:
          create_host_path: false
      - type: bind
        source: ${BINNY_APPDATA_DIRECTORY:?请设置应用数据目录}/collectors/rss
        target: /var/lib/binny/collector-state
        bind:
          create_host_path: false
    stop_grace_period: 30s
    restart: unless-stopped

  runtime-linuxdo:
    image: ${BINNY_LINUXDO_IMAGE:-binny/linuxdo:local}
    depends_on:
      server:
        condition: service_healthy
    environment:
      BINNY_API_URL: http://server:3000
      BINNY_BIN_ID: ${BINNY_LINUXDO_BIN_ID:-linuxdo}
      BINNY_RUNTIME_ENVIRONMENT: browser
      BINNY_RUNTIME_PORT: 8080
      BINNY_BROWSER_PROFILE_REUSE: "true"
    volumes:
      - type: bind
        source: ${BINNY_APPDATA_DIRECTORY:?请设置应用数据目录}/runtime/linuxdo
        target: /var/lib/binny/runtime
        bind:
          create_host_path: false
    stop_grace_period: 30s
    restart: unless-stopped
