      BINNY_RUNTIME_PORT: 8080
      BINNY_BROWSER_PROFILE_REUSE: "true"
    volumes:
      - type: bind
        source: ${BINNY_APPDATA_DIRECTORY:?请设置应用数据目录}/browser-profiles/linuxdo
