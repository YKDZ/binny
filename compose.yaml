x-binny-image: &binny-image
  image: ${BINNY_IMAGE:-binny01-server:local}
  build:
    context: .
    dockerfile: Dockerfile

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: binny
      POSTGRES_USER: binny
      POSTGRES_PASSWORD: ${BINNY_POSTGRES_PASSWORD:-binny}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U binny -d binny
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  server:
    <<: *binny-image
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://binny:${BINNY_POSTGRES_PASSWORD:-binny}@postgres:5432/binny
      BINNY_API_URL: http://127.0.0.1:3000
      PORT: 3000
    ports:
      - "${BINNY_PORT:-3000}:3000"
    volumes:
      - bins:/var/lib/binny/bins
    restart: unless-stopped

  runtime-one:
    image: ${BINNY14_RUNTIME_IMAGE:-binny14-lightweight:local}
    profiles: [binny14]
    build:
      context: .
      dockerfile: packages/collector-runtime/Dockerfile.lightweight
      args:
        BINNY_COLLECTOR_PACKAGE: "@binny/collector-runtime"
        BINNY_COLLECTOR_ENTRY: fixture-dist/collector.js
        BINNY_BUILD_FIXTURE: "1"
    depends_on:
      server:
        condition: service_started
    environment:
      BINNY_API_URL: http://server:3000
      BINNY_BIN_ID: binny14-one
      BINNY_RUNTIME_PORT: 8080
      BINNY_RUNTIME_ENVIRONMENT: lightweight
    ports:
      - "${BINNY14_RUNTIME_ONE_PORT:-14141}:8080"
    restart: unless-stopped

  runtime-two:
    image: ${BINNY14_RUNTIME_IMAGE:-binny14-lightweight:local}
    profiles: [binny14]
    depends_on:
      server:
        condition: service_started
    environment:
      BINNY_API_URL: http://server:3000
      BINNY_BIN_ID: binny14-two
      BINNY_RUNTIME_PORT: 8080
      BINNY_RUNTIME_ENVIRONMENT: lightweight
    ports:
      - "${BINNY14_RUNTIME_TWO_PORT:-14142}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
  bins:
