x-binny-image: &binny-image
  image: ${BINNY_IMAGE:-binny01-server:local}
  build:
    context: .
    dockerfile: Dockerfile

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: binny
      POSTGRES_USER: binny
      POSTGRES_PASSWORD: ${BINNY_POSTGRES_PASSWORD:-binny}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U binny -d binny
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  server:
    <<: *binny-image
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://binny:${BINNY_POSTGRES_PASSWORD:-binny}@postgres:5432/binny
      BINNY_API_URL: http://127.0.0.1:3000
      BINNY_RESOURCE_DIRECTORY: /var/lib/binny/resources
      BINNY_RESOURCE_UNREFERENCED_AGE_MS: ${BINNY_RESOURCE_UNREFERENCED_AGE_MS:-86400000}
      BINNY_RESOURCE_CLEANUP_INTERVAL_MS: ${BINNY_RESOURCE_CLEANUP_INTERVAL_MS:-3600000}
      PORT: 3000
    ports:
      - "${BINNY_PORT:-3000}:3000"
    volumes:
      - bins:/var/lib/binny/bins
      - resource-data:/var/lib/binny/resources
    restart: unless-stopped

  manual-runs-source:
    <<: *binny-image
    profiles: [binny15]
    command:
      - node
      - --conditions=source
      - packages/api/scripts/manual-runs-source.ts
      - --serve
    environment:
      BINNY15_SOURCE_PORT: 8081
    ports:
      - "${BINNY15_SOURCE_HOST_PORT:-18815}:8081"
    restart: unless-stopped

  rss-e2e-source:
    <<: *binny-image
    profiles: [binny22]
    command:
      - node
      - --conditions=source
      - scripts/binny-e2e-rss-source.ts
    environment:
      BINNY22_SOURCE_PORT: 8081
    restart: unless-stopped

  runtime-one:
    image: ${BINNY14_RUNTIME_IMAGE:-binny14-lightweight:local}
    profiles: [binny14]
    build:
      context: .
      dockerfile: packages/collector-runtime/Dockerfile.lightweight
      args:
        BINNY_COLLECTOR_PACKAGE: "@binny/collector-runtime"
        BINNY_COLLECTOR_ENTRY: fixture-dist/collector.js
        BINNY_BUILD_FIXTURE: "1"
    depends_on:
      server:
        condition: service_started
    environment:
      BINNY_API_URL: http://server:3000
      BINNY_BIN_ID: binny14-one
      BINNY_RUNTIME_PORT: 8080
      BINNY_RUNTIME_ENVIRONMENT: lightweight
    volumes:
      - runtime-one-owner:/var/lib/binny/runtime
    ports:
      - "${BINNY14_RUNTIME_ONE_PORT:-14141}:8080"
    restart: unless-stopped

  runtime-two:
    image: ${BINNY14_RUNTIME_IMAGE:-binny14-lightweight:local}
    profiles: [binny14]
    depends_on:
      server:
        condition: service_started
    environment:
      BINNY_API_URL: http://server:3000
      BINNY_BIN_ID: binny14-two
      BINNY_RUNTIME_PORT: 8080
      BINNY_RUNTIME_ENVIRONMENT: lightweight
    volumes:
      - runtime-two-owner:/var/lib/binny/runtime
    ports:
      - "${BINNY14_RUNTIME_TWO_PORT:-14142}:8080"
    restart: unless-stopped

  runtime-fifteen-one:
    image: ${BINNY15_RUNTIME_IMAGE:-binny15-lightweight:local}
    profiles: [binny15]
    build:
      context: .
      dockerfile: packages/collector-runtime/Dockerfile.lightweight
      args:
        BINNY_COLLECTOR_PACKAGE: "@binny/collector-runtime"
        BINNY_COLLECTOR_ENTRY: fixture-dist/manual-runs-collector.js
        BINNY_BUILD_FIXTURE: "1"
    depends_on:
      server:
        condition: service_started
    environment:
      BINNY_API_URL: http://server:3000
      BINNY_BIN_ID: binny15-one
      BINNY_RUNTIME_PORT: 8080
      BINNY_RUNTIME_ENVIRONMENT: lightweight
      BINNY_RUNTIME_RUN_STOP_GRACE_MS: ${BINNY18_STOP_GRACE_MS:-2000}
    volumes:
      - runtime-fifteen-one-owner:/var/lib/binny/runtime
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  runtime-fifteen-two:
    image: ${BINNY15_RUNTIME_IMAGE:-binny15-lightweight:local}
    profiles: [binny15]
    build:
      context: .
      dockerfile: packages/collector-runtime/Dockerfile.lightweight
      args:
        BINNY_COLLECTOR_PACKAGE: "@binny/collector-runtime"
        BINNY_COLLECTOR_ENTRY: fixture-dist/manual-runs-collector.js
        BINNY_BUILD_FIXTURE: "1"
    depends_on:
      server:
        condition: service_started
    environment:
      BINNY_API_URL: http://server:3000
      BINNY_BIN_ID: binny15-two
      BINNY_RUNTIME_PORT: 8080
      BINNY_RUNTIME_ENVIRONMENT: lightweight
      BINNY_RUNTIME_RUN_STOP_GRACE_MS: ${BINNY18_STOP_GRACE_MS:-2000}
    volumes:
      - runtime-fifteen-two-owner:/var/lib/binny/runtime
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  runtime-rss:
    image: ${BINNY22_RUNTIME_IMAGE:-binny22-rss:local}
    profiles: [binny22]
    build:
      context: .
      dockerfile: packages/collector-runtime/Dockerfile.lightweight
      args:
        BINNY_COLLECTOR_PACKAGE: "@binny/collector-rss"
        BINNY_COLLECTOR_ENTRY: dist/index.js
    depends_on:
      server:
        condition: service_started
    environment:
      BINNY_API_URL: http://server:3000
      BINNY_BIN_ID: binny22-one
      BINNY_RUNTIME_PORT: 8080
      BINNY_RUNTIME_ENVIRONMENT: lightweight
      BINNY_COLLECTOR_STATE_DIRECTORY: /var/lib/binny/collector-state
    volumes:
      - rss-one-collector-state:/var/lib/binny/collector-state
      - rss-one-owner:/var/lib/binny/runtime
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  runtime-rss-two:
    image: ${BINNY22_RUNTIME_IMAGE:-binny22-rss:local}
    profiles: [binny22]
    build:
      context: .
      dockerfile: packages/collector-runtime/Dockerfile.lightweight
      args:
        BINNY_COLLECTOR_PACKAGE: "@binny/collector-rss"
        BINNY_COLLECTOR_ENTRY: dist/index.js
    depends_on:
      server:
        condition: service_started
    environment:
      BINNY_API_URL: http://server:3000
      BINNY_BIN_ID: binny22-two
      BINNY_RUNTIME_PORT: 8080
      BINNY_RUNTIME_ENVIRONMENT: lightweight
      BINNY_COLLECTOR_STATE_DIRECTORY: /var/lib/binny/collector-state
    volumes:
      - rss-two-collector-state:/var/lib/binny/collector-state
      - rss-two-owner:/var/lib/binny/runtime
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres-data:
  bins:
  resource-data:
  runtime-one-owner:
  runtime-two-owner:
  runtime-fifteen-one-owner:
  runtime-fifteen-two-owner:
  rss-one-owner:
  rss-one-collector-state:
  rss-two-owner:
  rss-two-collector-state:
