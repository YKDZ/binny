x-binny-image: &binny-image
  image: ${BINNY_IMAGE:-binny/server:local}
  build:
    context: .
    dockerfile: Dockerfile

x-binny-runtime-watch: &binny-runtime-watch
  - path: ./source-adapters/rss/src
    action: rebuild
  - path: ./source-adapters/rss/package.json
    action: rebuild
  - path: ./packages/source-adapter-runtime
    action: rebuild
  - path: ./packages/source-adapter-sdk/src
    action: rebuild
  - path: ./packages/api/src
    action: rebuild
  - path: ./packages/contracts/src
    action: rebuild
  - path: ./packages/core/src
    action: rebuild
  - path: ./packages/db
    action: rebuild
  - path: ./packages/server/src
    action: rebuild
  - path: ./packages/source-adapter-runtime/package.json
    action: rebuild
  - path: ./packages/source-adapter-sdk/package.json
    action: rebuild
  - path: ./packages/api/package.json
    action: rebuild
  - path: ./packages/contracts/package.json
    action: rebuild
  - path: ./packages/core/package.json
    action: rebuild
  - path: ./packages/db/package.json
    action: rebuild
  - path: ./packages/server/package.json
    action: rebuild
  - path: ./packages/tooling-config
    action: rebuild
  - path: ./package.json
    action: rebuild
  - path: ./pnpm-lock.yaml
    action: rebuild
  - path: ./pnpm-workspace.yaml
    action: rebuild
  - path: ./.dockerignore
    action: rebuild

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: binny
      POSTGRES_USER: binny
      POSTGRES_PASSWORD: ${BINNY_POSTGRES_PASSWORD:-binny}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U binny -d binny
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  server:
    <<: *binny-image
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://binny:${BINNY_POSTGRES_PASSWORD:-binny}@postgres:5432/binny
      BINNY_BROWSER_CAPACITY_LIMIT: ${BINNY_BROWSER_CAPACITY_LIMIT:-2}
      BINNY_API_URL: http://127.0.0.1:3000
      BINNY_RESOURCE_DIRECTORY: /var/lib/binny/resources
      BINNY_RESOURCE_UNREFERENCED_AGE_MS: ${BINNY_RESOURCE_UNREFERENCED_AGE_MS:-86400000}
      BINNY_RESOURCE_CLEANUP_INTERVAL_MS: ${BINNY_RESOURCE_CLEANUP_INTERVAL_MS:-3600000}
      PORT: 3000
    ports:
      - "${BINNY_PORT:-3000}:3000"
    volumes:
      - bins:/var/lib/binny/bins
      - resource-data:/var/lib/binny/resources
    restart: unless-stopped

  browser-session-source:
    <<: *binny-image
    profiles: [binny-browser]
    command:
      - node
      - --conditions=source
      - scripts/browser-session-source.ts
    environment:
      BINNY_BROWSER_SOURCE_PORT: 8081
    restart: unless-stopped

  manual-runs-source:
    <<: *binny-image
    profiles: [binny-runs]
    command:
      - node
      - --conditions=source
      - packages/api/scripts/manual-runs-source.ts
      - --serve
    environment:
      BINNY_RUNS_SOURCE_PORT: 8081
    ports:
      - "${BINNY_RUNS_SOURCE_HOST_PORT:-18815}:8081"
    restart: unless-stopped

  rss-e2e-source:
    <<: *binny-image
    profiles: [binny-rss]
    command:
      - node
      - --conditions=source
      - scripts/binny-e2e-rss-source.ts
    environment:
      BINNY_RSS_SOURCE_PORT: 8081
    restart: unless-stopped

  runtime-one:
    image: ${BINNY_TEST_LIGHTWEIGHT_IMAGE:-binny/lightweight-fixture:local}
    profiles: [binny-runtime]
    build:
      context: .
      dockerfile: packages/source-adapter-runtime/Dockerfile.lightweight
      args:
        BINNY_SOURCE_ADAPTER_PACKAGE: "@binny/source-adapter-runtime"
        BINNY_SOURCE_ADAPTER_ENTRY: fixture-dist/source-adapter.js
        BINNY_BUILD_FIXTURE: "1"
    depends_on:
      server:
        condition: service_started
    environment:
      BINNY_API_URL: http://server:3000
      BINNY_RUNTIME_CONTROL_URL: http://runtime-one:8080
      BINNY_BIN_ID: binny-runtime-one
      BINNY_RUNTIME_PORT: 8080
      BINNY_RUNTIME_ENVIRONMENT: lightweight
    ports:
      - "${BINNY_RUNTIME_ONE_PORT:-14141}:8080"
    restart: unless-stopped

  runtime-two:
    image: ${BINNY_TEST_LIGHTWEIGHT_IMAGE:-binny/lightweight-fixture:local}
    profiles: [binny-runtime]
    depends_on:
      server:
        condition: service_started
    environment:
      BINNY_API_URL: http://server:3000
      BINNY_RUNTIME_CONTROL_URL: http://runtime-two:8080
      BINNY_BIN_ID: binny-runtime-two
      BINNY_RUNTIME_PORT: 8080
      BINNY_RUNTIME_ENVIRONMENT: lightweight
