    restart: unless-stopped

  runtime-fifteen-one:
    image: ${BINNY_TEST_RUNNER_IMAGE:-binny/runner-fixture:local}
    profiles: [binny-runs]
    depends_on:
      server:
        condition: service_started
    environment:
      BINNY_API_URL: http://server:3000
      BINNY_RUNTIME_CONTROL_URL: http://runtime-fifteen-one:8080
      BINNY_BIN_ID: binny-runs-one
      BINNY_RUNTIME_PORT: 8080
      BINNY_RUNTIME_ENVIRONMENT: lightweight
      BINNY_RUNTIME_RUN_STOP_GRACE_MS: ${BINNY_LIFECYCLE_STOP_GRACE_MS:-2000}
    labels:
      io.binny.managed-runtime: "true"
    restart: unless-stopped

  runtime-fifteen-two:
    image: ${BINNY_TEST_RUNNER_IMAGE:-binny/runner-fixture:local}
    profiles: [binny-runs]
    depends_on:
      server:
        condition: service_started
    environment:
